name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 PyQtWebEngine pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name AkakyBrowser akaky_browser.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkakyBrowser-exe
          path: dist/AkakyBrowser.exe
